<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手で描く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --fg:#e8e8e8; --sub:#9aa0a6; --panel:#1a1d24; --line:#2a2f38; --accent:#4fc3f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  main{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:1.3rem;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 12px;font-size:.9rem;line-height:1.6}
  .stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
  video{display:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
  .overlay p{margin:0;color:var(--sub);font-size:.9rem}
  button{font-family:inherit;font-size:1rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);
    border-radius:10px;padding:10px 16px;cursor:pointer}
  button.primary{background:var(--accent);color:#06222e;border-color:var(--accent);font-weight:700}
  button:disabled{opacity:.5}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .colors{display:flex;gap:8px}
  .sw{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}
  .sw.on{border-color:#fff}
  .status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .card .k{font-size:.75rem;color:var(--sub)}
  .card .v{font-size:1.05rem;font-weight:700;margin-top:2px}
  .help{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.9rem;line-height:1.8}
  .help b{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>手で描く</h1>
  <p class="lead">カメラに手を映すと、AIが指の位置を読み取ります。親指と人差し指をつまむと空中に線が描けます。映像は端末の中だけで処理され、外には送られません。</p>

  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="overlay" id="overlay">
      <button class="primary" id="startBtn">カメラを起動する</button>
      <p id="msg">初回はAIモデル（約8MB）を読み込みます</p>
    </div>
  </div>
  <video id="video" playsinline muted></video>

  <div class="bar">
    <div class="colors" id="colors"></div>
    <button id="clearBtn">全部消す</button>
    <button id="saveBtn">画像を保存</button>
  </div>

  <div class="status">
    <div class="card"><div class="k">見えている手</div><div class="v" id="sHands">-</div></div>
    <div class="card"><div class="k">指の状態</div><div class="v" id="sPose">-</div></div>
    <div class="card"><div class="k">処理速度</div><div class="v" id="sFps">-</div></div>
  </div>

  <div class="help">
    <b>つまむ</b>（親指と人差し指をくっつける）… 線を描く<br>
    <b>はなす</b> … ペンを上げる<br>
    <b>グーを1秒</b> … 全部消す<br>
    手全体が映るくらい、カメラから少し離れると安定します。<br>
    <a href="guitar/" style="color:var(--accent)">→ 空中ギターで遊ぶ</a>
  </div>
</main>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// 手の21点をつなぐ線
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const COLORS = ["#4fc3f7","#ff6b6b","#ffd54f","#81c784","#ffffff"];

const $ = id => document.getElementById(id);
const video = $("video"), view = $("view"), ctx = view.getContext("2d");
const ink = document.createElement("canvas"), ictx = ink.getContext("2d");

let landmarker = null, W = 640, H = 480;
let color = COLORS[0];
let lastVideoTime = -1, result = null;
let pinching = false, prev = null, cursor = null;
let fistStart = 0;
let frames = 0, fpsT = performance.now();

// 色ボタン
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "sw" + (i === 0 ? " on" : "");
  b.style.background = c;
  b.setAttribute("aria-label", "色 " + (i + 1));
  b.onclick = () => {
    color = c;
    document.querySelectorAll(".sw").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  };
  $("colors").appendChild(b);
});

$("clearBtn").onclick = () => ictx.clearRect(0, 0, W, H);
$("saveBtn").onclick = () => {
  view.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "te-de-egaku.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
};

$("startBtn").onclick = start;

async function createLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  for (const delegate of ["GPU", "CPU"]) {
    try {
      return await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: "VIDEO",
        numHands: 2
      });
    } catch (e) { console.warn(delegate + " で失敗", e); }
  }
  throw new Error("AIモデルを読み込めませんでした");
}

async function start() {
  $("startBtn").disabled = true;
  try {
    $("msg").textContent = "AIモデルを読み込み中…";
    landmarker = await createLandmarker();

    $("msg").textContent = "カメラを起動中…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    W = video.videoWidth; H = video.videoHeight;
    view.width = ink.width = W;
    view.height = ink.height = H;
    $("stage").style.aspectRatio = W + " / " + H;
    ictx.lineCap = "round"; ictx.lineJoin = "round";

    $("overlay").style.display = "none";
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    $("msg").textContent = "起動できませんでした：" + (e.message || e);
    $("startBtn").disabled = false;
  }
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    result = landmarker.detectForVideo(video, performance.now());
    frames++;
  }
  render();
  const now = performance.now();
  if (now - fpsT > 1000) {
    $("sFps").textContent = Math.round(frames * 1000 / (now - fpsT)) + " fps";
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(loop);
}

// 画面は鏡写しにするので x を反転
const pt = lm => ({ x: (1 - lm.x) * W, y: lm.y * H });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function isFist(p) {
  // 人差し指〜小指の先が、第2関節より手首に近ければ「曲げている」
  return [[8,6],[12,10],[16,14],[20,18]].every(([tip, pip]) => dist(p[tip], p[0]) < dist(p[pip], p[0]));
}

function render() {
  // カメラ映像（鏡写し・少し暗く）
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  const hands = (result && result.landmarks) || [];
  $("sHands").textContent = hands.length + " 本";

  let pose = "手が見えません";

  if (hands.length) {
    const p = hands[0].map(pt);
    const size = dist(p[0], p[9]);              // 手の大きさ（手首〜中指の付け根）
    const ratio = dist(p[4], p[8]) / size;       // つまみ具合
    const fist = isFist(p);

    // 少し余裕を持たせて判定がチカチカしないようにする
    if (fist) pinching = false;
    else if (!pinching && ratio < 0.30) pinching = true;
    else if (pinching && ratio > 0.45) pinching = false;

    // ペン先 = 親指と人差し指の中間（なめらかに追従）
    const target = { x: (p[4].x + p[8].x) / 2, y: (p[4].y + p[8].y) / 2 };
    cursor = cursor ? { x: cursor.x + (target.x - cursor.x) * 0.5, y: cursor.y + (target.y - cursor.y) * 0.5 } : target;

    if (pinching) {
      if (prev) {
        ictx.strokeStyle = color;
        ictx.lineWidth = Math.max(4, W * 0.012);
        ictx.beginPath();
        ictx.moveTo(prev.x, prev.y);
        ictx.lineTo(cursor.x, cursor.y);
        ictx.stroke();
      }
      prev = { ...cursor };
      pose = "描いています";
    } else {
      prev = null;
      pose = fist ? "グー" : "ペンを上げています";
    }

    // グー1秒で全消し
    if (fist) {
      if (!fistStart) fistStart = performance.now();
      const t = (performance.now() - fistStart) / 1000;
      drawRing(p[9], Math.min(t, 1));
      if (t >= 1) { ictx.clearRect(0, 0, W, H); fistStart = performance.now() + 1e9; pose = "消しました"; }
    } else {
      fistStart = 0;
    }
  } else {
    pinching = false; prev = null; cursor = null; fistStart = 0;
  }

  // 描いた線
  ctx.drawImage(ink, 0, 0);

  // 手の骨格
  hands.forEach((h, i) => {
    const p = h.map(pt);
    ctx.strokeStyle = i === 0 ? "rgba(79,195,247,0.9)" : "rgba(200,200,200,0.7)";
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    BONES.forEach(([a, b]) => { ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); });
    ctx.stroke();
    ctx.fillStyle = "#fff";
    p.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(2.5, W * 0.005), 0, Math.PI * 2); ctx.fill(); });
  });

  // ペン先カーソル
  if (cursor) {
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y, Math.max(8, W * 0.018), 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    if (pinching) { ctx.fillStyle = color; ctx.fill(); }
    ctx.stroke();
  }

  $("sPose").textContent = pose;
}

function drawRing(center, progress) {
  if (progress <= 0) return;
  const r = Math.max(24, W * 0.06);
  ctx.beginPath();
  ctx.arc(center.x, center.y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#ff6b6b";
  ctx.stroke();
}
</script>
</body>
</html>
