<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紙のピアノ 印刷用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 10mm; }
  *{box-sizing:border-box}
  body{margin:0;background:#e9e9e6;color:#111;font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  .tools{max-width:297mm;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tools button{font-family:inherit;font-size:1rem;padding:10px 16px;border-radius:10px;border:1px solid #888;background:#fff;cursor:pointer}
  .tools p{margin:0;font-size:.9rem;color:#444}
  .sheet{width:277mm;height:190mm;margin:0 auto 12px;background:#fff;padding:0;display:flex;flex-direction:column;
    break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .board{flex:1;border:3mm solid #000;display:grid}
  .cell{border-right:.7mm solid #000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10mm;
    font-size:22pt;font-weight:700}
  .cell:last-child{border-right:none}
  .drum .cell{align-items:center;padding:0;font-size:26pt}
  .cap{font-size:9pt;color:#444;padding-top:3mm;text-align:center}
  @media screen{ .sheet{box-shadow:0 2px 10px rgba(0,0,0,.15)} }
  @media screen and (max-width:1100px){
    .sheet{width:calc(100vw - 32px);height:calc((100vw - 32px) * 0.686)}
    .cell{font-size:4vw;padding-bottom:3vw}
    .drum .cell{font-size:4.5vw}
  }
  @media print{ body{background:#fff} .tools{display:none} .sheet{margin:0} }
</style>
</head>
<body>
  <div class="tools">
    <button onclick="window.print()">印刷する</button>
    <p>A4横で2枚（ピアノ・ドラム）出ます。使うほうだけでも大丈夫です。太い外枠の四隅を、画面でタップします。</p>
  </div>

  <div class="sheet">
    <div class="board" style="grid-template-columns:repeat(8,1fr)">
      <div class="cell">ド</div><div class="cell">レ</div><div class="cell">ミ</div><div class="cell">ファ</div>
      <div class="cell">ソ</div><div class="cell">ラ</div><div class="cell">シ</div><div class="cell">ド</div>
    </div>
    <div class="cap">紙のピアノ（8鍵）— 左から ド レ ミ ファ ソ ラ シ ド</div>
  </div>

  <div class="sheet drum">
    <div class="board" style="grid-template-columns:repeat(4,1fr)">
      <div class="cell">キック</div><div class="cell">スネア</div><div class="cell">ハイハット</div><div class="cell">クラップ</div>
    </div>
    <div class="cap">紙のドラム（4パッド）</div>
  </div>
</body>
</html>
